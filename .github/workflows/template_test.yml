# v1.0.0 - Plantilla modular para validación de calidad
name: Test Template

on:
  workflow_call:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 
      - uses: actions/setup-node@v4
        with:
          node-version: '20' 

      - name: Install dependencies
        run: npm install 

      - name: Run Tests
        run: npm test 
