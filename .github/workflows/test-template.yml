# v1.0.0 - Plantilla modular de Pruebas y Auditoría
name: CI Test Template
on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Security Audit
        run: npm audit --audit-level=moderate
      - name: Run Tests
        run: npm test