# v1.0.0 - Plantilla modular de Despliegue en AWS ECR
name: CD Deploy Template
on:
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID: {required: true}
      AWS_SECRET_ACCESS_KEY: {required: true}
      AWS_SESSION_TOKEN: {required: true} # Obligatorio para Academy
jobs:
  build-docker-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and Push Image
        run: |
          docker build -t techmarket-app:${{ github.sha }} .
          docker tag techmarket-app:${{ github.sha }} ${{ steps.login-ecr.outputs.registry }}/techmarket-repo:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/techmarket-repo:${{ github.sha }}