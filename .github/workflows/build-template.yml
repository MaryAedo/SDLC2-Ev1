name: CI Build Template
on:
  workflow_call: # Esto permite que sea una plantilla reutilizable
    inputs:
      node-version:
        required: true
        type: string
jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm' # Optimización con caché (Punto clave de la rúbrica)
      - name: Install dependencies
        run: npm ci
      - name: Security Audit
        run: npm audit --audit-level=moderate
      - name: Run Tests
        run: npm test